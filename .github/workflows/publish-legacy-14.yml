name: Publish Legacy 14
run-name: "Publish Legacy 14 · ${{ github.run_id }}"

# Simple release for the legacy Node.js 14 / OTEL SDK v1 distro (branch
# nodejs-community-14). Finds the latest nodejs-community-14/v0.0.x git tag,
# bumps the patch, tags git with that prefix, and pushes the image to ECR +
# Depot as bare v0.0.x. No approval gate — rarely used.
#
# Must live on main so workflow_dispatch is available in the Actions UI.
# Always builds from the nodejs-community-14 branch.

concurrency:
  group: publish-legacy-14
  cancel-in-progress: false

permissions: read-all

on:
  workflow_dispatch:

env:
  DOCKER_REPOSITORY_NAME: nodejs-community-14
  DEPOT_REPOSITORY_NAME: agents/nodejs-community-14
  ECR_REGISTRY: public.ecr.aws/odigos/agents
  DEPOT_REGISTRY: p0xd21zf5r.registry.depot.dev
  # Git tags for this distro are namespaced so they do not collide with mainline v0.0.x.
  GIT_TAG_PREFIX: nodejs-community-14/

jobs:
  release:
    runs-on: depot-ubuntu-24.04-4
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Get STS token
        id: sts
        uses: odigos-io/ci-core/sts@main
        with:
          identity: tag-releaser
          output-git-config: "true"

      - uses: actions/checkout@v7
        with:
          ref: nodejs-community-14
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.sts.outputs.GH_TOKEN }}

      - name: Calculate next v0.0.x version
        id: version
        run: |
          latest=$(git tag -l "${GIT_TAG_PREFIX}v0.0.*" | sort -V | tail -1)
          if [[ -z "${latest}" ]]; then
            new_version="v0.0.1"
          else
            latest_version="${latest#"${GIT_TAG_PREFIX}"}"
            patch="${latest_version##*.}"
            new_version="v0.0.$((patch + 1))"
          fi
          git_tag="${GIT_TAG_PREFIX}${new_version}"
          echo "latest=${latest:-none}" >> "$GITHUB_OUTPUT"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${latest:-none} → ${git_tag} (docker: ${new_version})"

      - name: Notify Slack (start)
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Starting release of OpenTelemetry Node.js Community 14 Agent ${{ steps.version.outputs.new_version }}"
          failure-description: "ERROR: Failed to start release of OpenTelemetry Node.js Community 14 Agent"
          tag: ${{ steps.version.outputs.git_tag }}

      - name: Create and push git tag
        env:
          GIT_TAG: ${{ steps.version.outputs.git_tag }}
        run: |
          git tag "${GIT_TAG}"
          git push origin "refs/tags/${GIT_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-upload
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws

      - name: Login to Depot Registry
        run: echo "${{ secrets.DEPOT_DEV_AGENT_PUBLISH_TOKEN }}" | docker login ${DEPOT_REGISTRY} -u x-token --password-stdin

      - name: Compute Docker tags
        id: docker-tags
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          echo "tags=${ECR_REGISTRY}/${DOCKER_REPOSITORY_NAME}:${NEW_VERSION},${DEPOT_REGISTRY}/${DEPOT_REPOSITORY_NAME}:${NEW_VERSION},${ECR_REGISTRY}/${DOCKER_REPOSITORY_NAME}:latest,${DEPOT_REGISTRY}/${DEPOT_REPOSITORY_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          push: true
          build-args: AGENT_VERSION=${{ steps.version.outputs.new_version }}
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Published a new release of OpenTelemetry Node.js Community 14 Agent"
          failure-description: "ERROR: Failed to publish a new release of OpenTelemetry Node.js Community 14 Agent"
          tag: ${{ steps.version.outputs.git_tag }}
